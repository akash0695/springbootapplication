name: 'Build and Deploy to GKE'

on:
  push:
    branches:
      - '"main"'

env:
  PROJECT_ID: 'nodal-crawler-460115-d2' # **YOUR GOOGLE CLOUD PROJECT ID**
  GAR_LOCATION: 'us-central1' # **Region for Artifact Registry and GKE cluster**
  GKE_CLUSTER: 'your-gke-cluster-name' # **Name of your GKE cluster**
  GKE_ZONE: 'us-central1-c' # **Zone where your GKE cluster is located (or a region if it's regional)**
  DEPLOYMENT_NAME: 'your-app-deployment' # **Name of your Kubernetes Deployment**
  REPOSITORY: 'your-artifact-registry-repo' # **Name of your Artifact Registry Docker repository**
  IMAGE: 'static-site' # **Name of the Docker image**
  WORKLOAD_IDENTITY_PROVIDER: 'projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider' # **YOUR WORKLOAD IDENTITY PROVIDER**

jobs:
  setup-build-publish-deploy:
    name: 'Setup, Build, Publish, and Deploy'
    runs-on: 'ubuntu-latest'
    environment: 'production'

    permissions:
      contents: 'read'
      id-token: 'write' # This is required for Workload Identity Federation

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4' # Updated to v4 for clarity

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2' # Updated to v2 for clarity
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          # Add 'service_account: 'your-github-actions-sa@your-project-id.iam.gserviceaccount.com''
          # if you've specifically created a service account for this purpose
          # and want to ensure it's used. Otherwise, the workload identity provider
          # configuration typically handles mapping to a SA.

      - name: 'Docker Auth'
        uses: 'docker/login-action@v3' # Updated to v3 for clarity
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v2' # Updated to v2 for clarity
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      - name: 'Build and push Docker container'
        run: |-
          DOCKER_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"

          docker build \
            --tag "${DOCKER_TAG}" \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_REF="${GITHUB_REF}" \
            .

          docker push "${DOCKER_TAG}"

      - name: 'Set up Kustomize'
        run: |-
          curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          chmod u+x ./kustomize

      - name: 'Deploy to GKE'
        run: |-
          # This Kustomize command assumes you have a kustomization.yaml file in your repo root
          # and that it contains an image definition like:
          # images:
          #   - name: LOCATION-docker.pkg.dev/PROJECT_ID/REPOSITORY/IMAGE
          #     newTag: some-old-tag
          ./kustomize edit set image LOCATION-docker.pkg.dev/PROJECT_ID/REPOSITORY/IMAGE:$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA
          ./kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/$DEPLOYMENT_NAME
          kubectl get services -o wide
