# ============================================
# Local Development Profile
# ============================================
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Or set: spring.profiles.active=local

# ============================================
# Server Configuration (HTTP only for local dev)
# ============================================
server.port=8080
server.ssl.enabled=false

# ============================================
# H2 Database Configuration
# ============================================
spring.datasource.url=jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console - Access at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Other Settings
# ============================================
spring.main.allow-circular-references=true
spring.devtools.restart.enabled=true
spring.jpa.open-in-view=false

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JWT Secret
jwt.secret=javainuse
