# Production profile using H2 (in-memory) - for testing only
# Run with: -Dspring.profiles.active=prod-h2

# Server
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=sakshi@599234
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
server.port=443
server.http.port=8181

# Datasource - H2 in-memory for prod-h2
spring.datasource.url=jdbc:h2:mem:proddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.platform=h2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# General
spring.main.allow-circular-references=true
spring.devtools.restart.enabled=false
spring.jpa.open-in-view=false

# Connection pool settings (keep small for low-memory environments)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

jwt.secret=javainuse
